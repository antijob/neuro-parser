name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - stage
  workflow_dispatch:
    inputs:
      runType:
        description: "How to run this build?"
        required: true
        default: "default"
        type: choice
        options:
          - Force build
          - Default
      keepTests:
        description: "Keep test artifacts and folders. They will be kept only in case of failed tests by default"
        required: true
        default: "default"
        type: choice
        options:
          - Always keep
          - Default

jobs:
  check-docs:
    name: Check docs
    uses: "./.github/workflows/check-docs.yml"

  verify:
    name: Verify
    uses: "./.github/workflows/verify.yml"

  # Jobs below run on the production host. They never run for pull requests,
  # because pull request code is untrusted.
  clean:
    name: Clean images
    if: github.event_name != 'pull_request'
    needs:
      - check-docs
      - verify
    runs-on:
      [
        "self-hosted",
        "neuroparser",
        "production",
      ]
    steps:
      - name: Clean unused images and network
        run: |
          docker image prune -f

  build:
    name: Build
    if: github.event_name != 'pull_request'
    needs:
      - clean
    uses: "./.github/workflows/build.yml"
    secrets: inherit
    with:
      runType: "${{ github.event.inputs.runType }}"

  test:
    name: Run tests
    needs:
      - check-docs
      - verify
    uses: "./.github/workflows/tests.web.yml"
    with:
      keepTests: "${{ github.event.inputs.keepTests == 'Always keep'}}"

  start_prod:
    name: Start prod
    needs:
      - build
      - test
    uses: "./.github/workflows/deploy.yml"
    if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    secrets: inherit
    with:
      environment: production
